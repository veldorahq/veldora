name: CI — Starter Application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    name: PHP ${{ matrix.php }} Smoke Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, json, xml, curl
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Test Application Boot & Diagnostics
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php veldora key:generate
          php veldora about
          php veldora doctor
