name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          VERSION_NO_V="${VERSION#v}"
          NOTES=""
          if [ -f "CHANGELOG.md" ]; then
            NOTES=$(awk "/^## \[?${VERSION_NO_V}\]?/{flag=1; next} /^## \[?[0-9]/{if(flag) exit} flag" CHANGELOG.md || true)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="Release ${{ steps.version.outputs.VERSION }} — see [CHANGELOG.md](https://github.com/veldorahq/veldora/blob/main/CHANGELOG.md) for details."
          fi
          {
            echo 'NOTES<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: "Veldora ${{ steps.version.outputs.VERSION }}"
          body: |
            ## What's Changed in ${{ steps.version.outputs.VERSION }}

            ${{ steps.changelog.outputs.NOTES }}

            ---

            **Full Changelog**: https://github.com/veldorahq/veldora/blob/main/CHANGELOG.md
            **Documentation**: https://veldora.modrao.com
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
